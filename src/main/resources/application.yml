spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/mes}
    username: ${DATABASE_USER:mes}
    password: ${DATABASE_PASSWORD:mes-local}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
