services:
  app:
    build:
      context: .
      target: runtime
    image: ghcr.io/ndndndn1/mes-anomaly-operations:latest
    ports: ["127.0.0.1:8802:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/mes
      DATABASE_USER: mes
      DATABASE_PASSWORD: mes-local
      REDIS_HOST: redis
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mes"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
